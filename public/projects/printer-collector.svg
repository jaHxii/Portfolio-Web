<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Window chrome (desktop app) -->
  <rect x="0" y="0" width="800" height="36" fill="#042f2e" opacity="0.95"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#22c55e"/>
  <rect x="66" y="8" width="420" height="20" rx="6" fill="#134e4a"/>
  <text x="88" y="21" font-family="Consolas, monospace" font-size="10" fill="#5eead4">printer-scan.exe — Device Discovery</text>

  <!-- Sidebar -->
  <rect x="0" y="36" width="170" height="464" fill="#042f2e" opacity="0.85"/>
  <rect x="16" y="54" width="10" height="10" rx="2" fill="#14b8a6"/>
  <text x="34" y="63" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ccfbf1">Printer Scanner</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#5eead4">
    <text x="20" y="95">🖨 Discover</text>
    <text x="20" y="115">📡 Active Scan</text>
    <text x="20" y="135">📊 Report</text>
    <text x="20" y="155">🗂 History</text>
    <text x="20" y="175">⚙️ Settings</text>
  </g>

  <!-- Header -->
  <text x="190" y="72" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f0fdfa">Network Printer Scan</text>
  <text x="190" y="88" font-family="Arial, sans-serif" font-size="10" fill="#99f6e4">Scanning 192.168.1.0/24 for printers on the local network…</text>

  <!-- Progress bar -->
  <rect x="190" y="104" width="564" height="18" rx="9" fill="#134e4a"/>
  <rect x="192" y="106" width="420" height="14" rx="7" fill="#14b8a6"/>
  <text x="640" y="117" font-family="Arial, sans-serif" font-size="10" fill="#99f6e4">3 of 4 found</text>

  <!-- Device table -->
  <rect x="190" y="140" width="564" height="280" rx="8" fill="#134e4a"/>
  <g font-family="Arial, sans-serif" font-size="10">
    <rect x="190" y="140" width="564" height="28" rx="8" fill="#0f766e"/>
    <text x="210" y="158" fill="#ccfbf1" font-weight="bold">DEVICE</text>
    <text x="420" y="158" fill="#ccfbf1" font-weight="bold">IP ADDRESS</text>
    <text x="580" y="158" fill="#ccfbf1" font-weight="bold">STATUS</text>

    <g fill="#f0fdfa">
      <rect x="202" y="176" width="24" height="24" rx="4" fill="#14b8a6" opacity="0.3"/><text x="209" y="193">🖨</text>
      <text x="236" y="193">HP LaserJet Pro M404</text><text x="420" y="193">192.168.1.10</text>
      <rect x="578" y="180" width="56" height="16" rx="8" fill="#059669"/><text x="590" y="192">Online</text>
    </g>
    <g fill="#f0fdfa">
      <rect x="202" y="212" width="24" height="24" rx="4" fill="#14b8a6" opacity="0.3"/><text x="209" y="229">🖨</text>
      <text x="236" y="229">Canon PIXMA G6020</text><text x="420" y="229">192.168.1.12</text>
      <rect x="578" y="216" width="56" height="16" rx="8" fill="#059669"/><text x="590" y="228">Online</text>
    </g>
    <g fill="#f0fdfa">
      <rect x="202" y="248" width="24" height="24" rx="4" fill="#14b8a6" opacity="0.3"/><text x="209" y="265">🖨</text>
      <text x="236" y="265">Epson WorkForce 7840</text><text x="420" y="265">192.168.1.15</text>
      <rect x="578" y="252" width="56" height="16" rx="8" fill="#d97706"/><text x="586" y="264">Offline</text>
    </g>
    <g fill="#f0fdfa">
      <rect x="202" y="284" width="24" height="24" rx="4" fill="#14b8a6" opacity="0.3"/><text x="209" y="301">🖨</text>
      <text x="236" y="301">Xerox Phaser 3260</text><text x="420" y="301">192.168.1.18</text>
      <rect x="578" y="288" width="56" height="16" rx="8" fill="#059669"/><text x="590" y="300">Online</text>
    </g>
    <g fill="#f0fdfa">
      <rect x="202" y="320" width="24" height="24" rx="4" fill="#14b8a6" opacity="0.3"/><text x="209" y="337">🖨</text>
      <text x="236" y="337">Brother HL-L2390DW</text><text x="420" y="337">192.168.1.20</text>
      <rect x="578" y="324" width="56" height="16" rx="8" fill="#059669"/><text x="590" y="336">Online</text>
    </g>
  </g>

  <!-- Footer buttons -->
  <rect x="190" y="436" width="130" height="26" rx="13" fill="#14b8a6"/>
  <text x="218" y="453" font-family="Arial, sans-serif" font-size="10" fill="#042f2e" font-weight="bold">Rescan Network</text>
  <rect x="336" y="436" width="130" height="26" rx="13" fill="#0f766e"/>
  <text x="368" y="453" font-family="Arial, sans-serif" font-size="10" fill="#ccfbf1">Export Report</text>
</svg>